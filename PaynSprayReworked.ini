; Pay'n'Spray Reworked - v1.0.0 - Mysterdogg
; Configuration file for PaynSprayReworked.cs
; Any missing key falls back to its default value.
; (November 2026).
 
[General]
Version=1.0.0
; Master switch. Enabled by default, use 0 to disable it.
AZ5=1
; Short status text when the game starts and when this file is reloaded. Disabled by default, use 1 to enable it.
ShowStatus=0
; Key for relaoding the INI in-game. F10 (121) by default. Uses Windows virtual-key codes, in DECIMAL. 
; Set key to 0 to disable it.
ReloadKey=121
 
[Price]
; Every visit is paid: the price is the sum of the services below.
; (Vanilla: $100, and only when the car's health is under 970, so a
; healthy car lost its stars for free.)
; Cost of repaint ($), only when the colors can change.
Paint=100
; Cost of each wanted star cleared ($).
PerStar=50
; Cost of repairs ($). Scales with the damage.
; Less damage costs less: half the health lost = half this price.
RepairMax=400
; Repairs are charged only below this health (vanilla 970; full = 1000)
RepairBelow=970
; Cars whose paint can't change (a paintjob, or colors locked by a
; mission) are still repaired, but the cops still know them. Their stars:
;   0 = cleared anyway (vanilla).
;   1 = kept.
;   2 = the shop lets you lie low inside: the stars are cleared.
PaintjobStars=2
; With PaintjobStars=2: extra game hours per star, (0-8).
HideHoursPerStar=2
 
[Service]
; Game hours that pass while the car is in the shop (0-23).
; 0 = vanilla.
; 2 = Chinatown Wars.
; 3 = GTA IV.
Hours=2
; Fade the screen while those hours pass. Enabled by default, use 0 to disable it.
Fade=1
; Turn and center the car to face the door, so it drives out forwards.
; Enabled by default, use 0 to disable it. 
TurnCar=1
 
[Police]
; With stars, if a cop see you drive in, the shop won't serve you (as in GTA IV), (vanilla 0).
RefuseIfSeen=1
; How far a cop can see you from, in meters. 40.0 by default.
SeenDistance=40.0
 
[Hours]
; Opening hours in game time (0-24).
; Always open by default.
OpenHour=0
CloseHour=24
 
[Messages]
; How the shop messages show:
; 0 = on the game's subtitle line.
; 1 = in the middle of the screen, like the vanilla Pay'n'Spray messages.
Style=1
; Text size in percent of the vanilla message size (vanilla 100).
Size=60
; Position in 640 x 448 units: X = middle of the text, Y = top of the
; first line. Y=163 keeps the vanilla height at the default size.
X=320.0
Y=163.0
; Font: 0 = gothic, 1 = subtitles, 2 = menu, 3 = pricedown.
Font=3
; Outline thickness (0 = none).
Edge=2
; Text color (0-255 each); the shop's warnings use their own red.
ColorR=235
ColorG=165
ColorB=35
; How long a message stays, in ms (4000 by default).
Time=4000
 
[Map]
; Radar icon for the Pay 'n' Spray in east Las Venturas. 
; Needs Proper Fixes or another mod that restores that shop.
LasVenturasEastBlip=1
 